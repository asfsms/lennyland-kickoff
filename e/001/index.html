          out.textContent=api.fmt(wires); msg.textContent=MSG[wires]||'';
        }
        btn.onclick=()=>{ if(wires>=5000) return; wires = wires<1000?1000:wires+1000; draw(); if(wires>=5000){ btn.disabled=true; api.done(); } };
        draw();
      }
    },
    parade: {
      title: 'Send the parade', cap: 'Count by threes as they go: 3, 6, 9...', hint: 'Send all 21 elephants first.',
      init(box, api){
        let sent=0; const ALL=21;
        box.innerHTML='<div class="pic"></div><div class="controls"><button class="btn small toybtn">Send 3 elephants</button><div class="readout">On the bridge: <b class="num out">0</b></div><div class="readout">Wobbles: <b class="num">0</b></div></div><p class="cap msg" style="margin-top:12px"></p>';
        const pic=box.querySelector('.pic'), btn=box.querySelector('.toybtn'), out=box.querySelector('.out'), msg=box.querySelector('.msg');
        function draw(fresh){
          let a='';
          for(let i=0;i<sent;i++){ const jumbo=i===ALL-1; a+=elephant(jumbo?52:556-i*24, 199, jumbo?0.36:0.22, {fill:'#C3CADB',dark:'#9AA3B8',cls:(fresh&&i>=sent-3)?'pop':''}); }
          pic.innerHTML=A.frame(A.nightSky()+shores(true)+bridge(true)+a, true);
          out.textContent=sent;
          msg.textContent = sent===0 ? 'Ready when you are.' : sent<ALL ? sent+' elephants on the bridge. Still steady!' : 'All 21 elephants are on the bridge, with big Jumbo at the back. Wobbles: zero!';
        }
        btn.onclick=()=>{ if(sent>=ALL) return; sent+=3; draw(true); if(sent>=ALL){ btn.disabled=true; api.done(); } };
        draw(false);
      }
    }
  };
})();
</script>
<script src="../../assets/engine.js"></script>
</body>
</html>
