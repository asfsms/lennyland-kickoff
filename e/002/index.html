  lesson: 'Today\'s story, "Inky\'s Great Escape": Inky was an octopus who lived at the National Aquarium of New Zealand. His body was about as big as a ball. An octopus has 8 arms lined with suckers, blue blood and no bones. Its body is soft and squishy. The only hard part is its beak, a hard mouth like a parrot\'s beak, so an octopus can squeeze through any hole its beak fits through. One night in 2016, after everyone went home, Inky squeezed out through a small gap at the top of his tank. He slid down to the floor and crossed the room, leaving a wet trail. He went into a drain hole 6 inches wide and slid down a pipe 164 feet long (about half a big soccer field) to the ocean. Nobody has seen him since. An octopus has 3 hearts: two push blood through the gills and one sends blood around the body. Another octopus at the aquarium, Blotchy, stayed home. A big soccer goal is 24 feet wide.',

  const A = window.ART;
  const SEA = '<rect width="640" height="300" fill="#3E9BCF"/><rect y="236" width="640" height="64" fill="#E8D49A"/>';
  /* an octopus with its head centered at (x, y); o.arms = how many arms to draw (8 unless told) */

    o=o||{}; const f=o.fill||'#E4572E', d=o.dark||'#B93C1C', n=o.arms==null?8:o.arms;
    let a='';
    for(let i=0;i<n;i++){
      const sx=-26+i*7.4, ex=-78+i*22.3, ey=64+(i%2?10:0), cx=(sx+ex)/2+(i<4?-16:16), cy=30;
      a+='<path d="M'+sx.toFixed(1)+' 14Q'+cx.toFixed(1)+' '+cy+' '+ex.toFixed(1)+' '+ey+'" fill="none" stroke="'+(i%2?d:f)+'" stroke-width="9" stroke-linecap="round"/>';
    }
    return '<g'+(o.cls?' class="'+o.cls+'"':'')+'><g transform="translate('+x+','+y+') scale('+s+')">'+a
      +'<ellipse cx="0" cy="-10" rx="36" ry="32" fill="'+f+'"/>'
      +'<circle cx="-13" cy="4" r="8" fill="#fff"/><circle cx="13" cy="4" r="8" fill="#fff"/><circle cx="-12" cy="5" r="3.6" fill="#1E2140"/><circle cx="14" cy="5" r="3.6" fill="#1E2140"/>'
      +(o.inner||'')+'</g></g>';
  }
  function heart(x, y, s){ return '<path transform="translate('+x+','+y+') scale('+s+')" d="M0 6C-10 -6 -22 2 -12 14L0 26L12 14C22 2 10 -6 0 6z" fill="#FF3B5C" stroke="#fff" stroke-width="1.5"/>'; }

  function tank(x, w, night, lid){
    const top=96, h=140;
    return '<rect x="'+x+'" y="'+top+'" width="'+w+'" height="'+h+'" fill="'+(night?'#2C6FA8':'#6CC3EE')+'"/>'
      +'<rect x="'+x+'" y="'+(top+h-16)+'" width="'+w+'" height="16" fill="#E8D49A"/>'
      +'<rect x="'+x+'" y="'+top+'" width="'+w+'" height="'+h+'" fill="none" stroke="'+(night?'#C9CEE0':'#1E2140')+'" stroke-width="5"/>'
      +(lid?'<rect x="'+(x-6)+'" y="'+(top-12)+'" width="'+(w-28)+'" height="12" rx="3" fill="'+(night?'#C9CEE0':'#1E2140')+'"/><rect x="'+(x+w-34)+'" y="'+(top-12)+'" width="38" height="12" fill="#FFD34D"/>':'');
  }
  /* a light label for night pictures; w = width in px */
  function lab(x, y, w, text){ return '<g transform="translate('+x+','+y+')"><rect width="'+w+'" height="28" rx="8" fill="#FFF6E0"/><text x="'+(w/2)+'" y="20" text-anchor="middle" font-size="16" fill="#1E2140" '+A.FONT+'>'+text+'</text></g>'; }
  function room(night){ return '<rect y="236" width="640" height="64" fill="'+(night?'#4A4660':'#C9B8A0')+'"/>'; }

  window.SCENES = {
    tank(){
      return A.frame(room(false)+tank(170,300,false,false)+bubbles([[230,130,6],[244,160,4],[420,140,5]])
        +octo(320,160,0.85)+A.tag(286,56,68,'Inky')
        +A.person(70,236,'#167C8A')+A.person(104,236,'#6A4FB3')+A.person(556,236,'#C8452D')
        +A.text(320,282,17,'An aquarium in New Zealand'));
    },
    body(){
      return A.frame(SEA+bubbles([[60,60,7],[84,100,5],[580,70,6],[556,120,4]])+octo(320,106,1.6)
        +A.tag(40,150,112,'blue blood')+A.tag(488,150,104,'no bones')+A.tag(270,262,100,'8 arms'));
    },
    beak(){
      return A.frame(SEA+octo(150,130,1.25)

        +lab(286,266,88,'wet trail'), true);

    pipe(){

        +'<rect x="470" y="150" width="170" height="150" fill="#3E9BCF"/><path d="M486 172q12 -7 24 0t24 0M560 196q12 -7 24 0t24 0" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/>'
        +'<path d="M70 60V150Q70 200 130 206L474 240" fill="none" stroke="#5F6B7E" stroke-width="34" stroke-linejoin="round"/>'

      title: 'Your turn: count the arms', cap: 'Tap the button to add arms. Count by twos: 2, 4, 6...', hint: 'Count all the arms first.',

        let arms=0;
        const MSG={0:'A head and two eyes. Where are the arms?',2:'2 arms. Like you!',4:'4 arms. Keep going!',6:'6 arms. One more tap!',8:'8 arms! That is what "octo" means: eight.'};

        const pic=box.querySelector('.pic'), btn=box.querySelector('.toybtn'), out=box.querySelector('.out'), msg=box.querySelector('.msg');
        function draw(){
          pic.innerHTML='<svg viewBox="0 0 640 260" role="img" aria-label="An octopus with '+arms+' arms"><rect width="640" height="260" fill="#3E9BCF"/><rect y="226" width="640" height="34" fill="#E8D49A"/>'

        draw();

    escape: {

      init(box, api){
        let at=0;
        const BTN=['Squeeze out','Slide down','Scoot across','Into the drain','Down the pipe','Free!'];
        const MSG=['Inky is in his tank. See the gap at the top?','Out through the gap. Squish!','Down the side of the tank to the floor.','Across the floor. A wet trail shows the way.','Into the drain hole. Only 6 inches wide!','Down the long pipe and SPLASH! Inky is in the ocean.'];
        const POS=[[96,104,0.5],[176,58,0.42],[206,126,0.42],[300,126,0.42],[340,196,0.28],[566,236,0.5]];
        box.innerHTML='<div class="pic"></div><div class="controls"><button class="btn small toybtn"></button><div class="readout">Moves: <b class="num out">0</b> of 5</div></div><p class="cap msg" style="margin-top:12px"></p>';
        const pic=box.querySelector('.pic'), btn=box.querySelector('.toybtn'), out=box.querySelector('.out'), msg=box.querySelector('.msg');
        function draw(){
          const p=POS[at];
          let trail='';
          if(at>=3) trail='<path d="M214 150H'+(at>3?330:292)+'" stroke="#9FD8F5" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 12"/>';

            +'<rect y="156" width="490" height="144" fill="#7A6250"/><rect y="150" width="490" height="10" fill="#4A4660"/>'
            +'<rect x="490" y="196" width="150" height="104" fill="#2C6FA8"/><path d="M506 214q12 -7 24 0t24 0M570 232q12 -7 24 0t24 0" fill="none" stroke="#fff" stroke-width="2" opacity=".5"/>'
            +'<path d="M340 152V214Q340 244 380 246L494 252" fill="none" stroke="#C9D2DE" stroke-width="24" stroke-linejoin="round"/>'
            +'<rect x="30" y="62" width="150" height="88" fill="#2C6FA8"/><rect x="30" y="62" width="150" height="88" fill="none" stroke="#C9CEE0" stroke-width="4"/>'

        btn.onclick=()=>{ if(at>=5) return; at+=1; draw(); if(at>=5){ btn.disabled=true; api.done(); } };
        draw();
      }
    }
  };
})();
