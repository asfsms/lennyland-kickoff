            +'<polygon points="228,66 320,22 412,66" fill="#6B7280" stroke="'+INK+'" stroke-width="4" stroke-linejoin="round"/>'
            +marks
            +'<path d="M120 300V86H240" fill="none" stroke="'+INK+'" stroke-width="14" stroke-linejoin="round"/><path d="M120 300V86H240" fill="none" stroke="'+(n?WATER:'#DCE6EE')+'" stroke-width="8" stroke-linejoin="round"/>'
            +A.text(120,70,16,'from the pump')+A.tag(40,150,60,'pipe'));
          out.textContent=(n*1000).toLocaleString('en-US');
          msg.textContent = n===0 ? 'The tank is empty. Start the pump!' : n<10 ? (n*1000).toLocaleString('en-US')+' gallons. Keep counting by thousands!' : '10,000 gallons. The tank is full!';
        }
        btn.onclick=()=>{ if(n>=10) return; n+=1; draw(); if(n>=10){ btn.disabled=true; api.done(); } };
        draw();
      }
    }
  };
})();
</script>
<script src="../../assets/engine.js"></script>
</body>
