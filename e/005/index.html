    },
    letters(){
      return A.frame('<rect width="640" height="300" fill="#EADBC3"/>'+comb(140,118,360,14,true)
        +A.tag(520,130,108,'17 letters')
        +A.tag(16,40,116,'6 thick teeth')+A.tag(16,222,120,'14 thin teeth'));
    },
    tryit(){
      const w=300, x=170, y=96; let teeth='';
      for(let i=0;i<20;i++) teeth+='<rect x="'+f(x+8+i*14.4)+'" y="'+(y+30)+'" width="8" height="64" rx="3" fill="#3FA7D6" stroke="'+INK+'" stroke-width="2"/>';
      return A.frame('<rect width="640" height="300" fill="#FFF8E7"/>'+teeth+'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="40" rx="12" fill="#3FA7D6" stroke="'+INK+'" stroke-width="3"/>'
        +'<rect y="226" width="640" height="74" fill="#D9A066"/>'+A.text(320,270,18,'1, 2, 3, 4, 5...','#fff')
        +A.tag(210,30,220,'How many teeth? Count!'));
    }
  };

  /* ===== the two things to play with ===== */
  window.TOYS = {
    bridge: {
      title: 'Your turn: the hair bridge', cap: 'Tap the button to help the louse get to the other head.', hint: 'Help the louse get all the way across first.',
      init(box, api){
        let at=0;
        const MSG=['The louse is on the first head. The other head is far away.','It tries to jump... Nope! A louse cannot jump or fly.','The two friends lean together. Their hair touches!','Now the louse can crawl. Step, step, step.','It is crawling over the hair bridge.','It made it! A louse only crawls. It needs heads to touch.'];
        const LAB=['Try to jump','Heads together','Crawl!','Crawl!','Crawl!','Crawl!'];
        box.innerHTML='<div class="pic"></div><div class="controls"><button class="btn small toybtn"></button><div class="readout">Crawl steps: <b class="num out">0</b></div></div><p class="cap msg" style="margin-top:12px"></p>';
        const pic=box.querySelector('.pic'), btn=box.querySelector('.toybtn'), msg=box.querySelector('.msg'), out=box.querySelector('.out');
        function draw(){ pic.innerHTML=A.frame(friends(at)); msg.textContent=MSG[at]; btn.textContent=LAB[at]; out.textContent=String(Math.max(0,at-2)); }
        btn.onclick=()=>{ if(at>=5) return; at+=1; draw(); if(at>=5){ btn.disabled=true; api.done(); } };
        draw();
      }
    },
    comb: {
      title: 'Your turn: carve the comb', cap: 'Tap the button to carve the thin teeth, 2 at a time. Count by 2s.', hint: 'Carve all 14 thin teeth first.',
      init(box, api){
        let n=0;
        box.innerHTML='<div class="pic"></div><div class="controls"><button class="btn small toybtn">Carve 2 teeth</button><div class="readout">Thin teeth: <b class="num out">0</b></div></div><p class="cap msg" style="margin-top:12px"></p>';
        const pic=box.querySelector('.pic'), btn=box.querySelector('.toybtn'), out=box.querySelector('.out'), msg=box.querySelector('.msg');
        function draw(){
          pic.innerHTML=A.frame('<rect width="640" height="300" fill="#EADBC3"/>'+comb(150,118,340,n*2,false)
            +A.tag(16,40,116,'6 thick teeth')+A.tag(16,222,104,'thin teeth'));
          out.textContent=String(n*2);
          msg.textContent = n===0 ? 'The thick teeth are done. Now carve the thin teeth!' : n<7 ? (n*2)+' thin teeth. Keep counting by 2s!' : '14 thin teeth. The comb is ready to catch lice!';
        }
        btn.onclick=()=>{ if(n>=7) return; n+=1; draw(); if(n>=7){ btn.disabled=true; api.done(); } };
        draw();
      }
    }
  };
})();
</script>
<script src="../../assets/engine.js"></script>
</body>
