        +'<ellipse cx="110" cy="92" rx="56" ry="24" fill="#fff"/><ellipse cx="150" cy="78" rx="40" ry="22" fill="#fff"/>'
        +[0,1,2,3].map(i=>'<path d="M'+(80+i*26)+' 122l-8 26" stroke="#3FA7D6" stroke-width="5" stroke-linecap="round"/>').join('')
        +'<path d="M200 120q26 -14 52 0t52 0M214 150q22 -12 44 0t44 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>'
        +boot(160,236,0.9,'#B98B52',0.22)
        +'<rect x="320" y="0" width="320" height="300" fill="'+DARK+'"/>'+stars([[360,60],[430,96],[500,56],[584,84],[620,130],[350,138]])+moonGround(170,320,640)
        +boot(480,236,0.9,'#5F6370',1)
        +'<path d="M320 0V300" stroke="'+INK+'" stroke-width="4"/>'
        +A.tag(50,16,220,'Earth: air, wind and rain')+A.tag(366,16,228,'Moon: no wind, no rain'));
    },
    photo(){
      return A.frame('<rect width="640" height="300" fill="'+GRAY+'"/>'
        +[[90,230,34],[560,210,40],[470,60,22],[250,262,18]].map(c=>'<circle cx="'+c[0]+'" cy="'+c[1]+'" r="'+c[2]+'" fill="'+GRAY2+'"/><circle cx="'+(c[0]+4)+'" cy="'+(c[1]+4)+'" r="'+(c[2]-6)+'" fill="#B9BDC7"/>').join('')
        +'<path d="M330 160q40 -50 110 -40q50 10 70 60M330 160q-50 30 -120 20q-40 -6 -70 20M330 160q10 50 70 80" fill="none" stroke="#4A4C58" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 9"/>'
        +'<rect x="318" y="150" width="28" height="28" fill="#4A4C58"/><rect x="312" y="144" width="26" height="26" fill="#FFF8E7" stroke="'+INK+'" stroke-width="3"/>'
        +'<rect x="16" y="16" width="190" height="104" rx="12" fill="'+DARK+'" stroke="'+INK+'" stroke-width="3"/>'
        +'<rect x="40" y="38" width="38" height="22" fill="#3FA7D6" stroke="#fff" stroke-width="2"/><rect x="142" y="38" width="38" height="22" fill="#3FA7D6" stroke="#fff" stroke-width="2"/><rect x="82" y="32" width="56" height="34" rx="6" fill="'+GOLD+'" stroke="#fff" stroke-width="2"/><circle cx="110" cy="72" r="7" fill="#fff"/>'
        +A.text(111,106,16,'robot spaceship','#fff')
        +A.tag(226,104,116,'the lander')+'<path d="M300 132l22 14" stroke="'+INK+'" stroke-width="3" stroke-linecap="round"/>'
        +A.tag(352,246,264,'paths where astronauts walked'));
    },
    twelve(){
      let row=''; for(let i=0;i<12;i++) row+=astro(52+i*48.7,262,0.62,i%2===1);
      return A.frame(stars(STARS)+earth(566,56,30)+'<rect y="214" width="640" height="86" fill="'+GRAY2+'"/>'+row
        +A.text(320,112,84,'12','#FFD34D')+A.tag(180,132,280,'people have walked on the Moon'), true);
    },
    around(){
      return A.frame(stars([[250,30],[330,270],[420,40],[40,40],[600,270],[200,270],[620,30]])
        +'<path d="M150 150C260 60 440 40 540 80A52 52 0 0 1 540 220C440 250 260 240 150 170" fill="none" stroke="#FFD34D" stroke-width="4" stroke-dasharray="4 10" stroke-linecap="round"/>'
        +earth(100,160,70)+moonBall(520,150,40)
        +'<path d="M318 60l34 13l-34 13z" fill="#fff" stroke="'+INK+'" stroke-width="3" stroke-linejoin="round"/>'
        +A.tag(238,100,180,'4 astronauts, 2026')
        +A.tag(60,246,80,'Earth')+A.tag(474,246,92,'the Moon'), true);
    },
    tryit(){
      return A.frame(stars([[40,30],[110,70],[170,24],[250,52],[330,22],[30,110],[300,100],[600,150]])
        +moonBall(500,84,50)
        +A.skyline(20,[70,110,84,130,96,60,120,90,74,104,66,88,112,70,96,120,80,100,64,90,110,76,98,84,70,106,92],'#070B1F',262)
        +[[50,200],[96,170],[142,190],[188,220],[234,176],[280,214],[372,196],[418,222],[556,190],[602,214]].map(w=>'<rect x="'+w[0]+'" y="'+w[1]+'" width="8" height="10" fill="#FFD34D"/>').join('')
        +'<rect y="262" width="640" height="38" fill="#070B1F"/>'
        +'<rect x="296" y="236" width="92" height="26" fill="#3A2A22"/>'+A.person(342,236,'#F9C80E',true)
        +A.tag(40,40,250,'Wave at the footprints!'), true);
    }
  };

  /* ===== the two things to play with ===== */
  window.TOYS = {
    wait: {
      title: 'Your turn: the waiting game', cap: 'Tap the button to wait. Watch both footprints.', hint: 'Keep waiting until one footprint is gone.',
      init(box, api){
        let at=0;
        const MSG=['Two fresh footprints: one in beach sand on Earth, one in dust on the Moon.','Day 1. On Earth, the wind blows the sand. On the Moon: no wind!','Day 2. On Earth, rain falls. On the Moon: no rain!','Day 3. On Earth, a wave rolls in. On the Moon: no waves!','On Earth the footprint is gone. On the Moon it looks brand new, even after 50 years!'];
        const LAB=['Wait a day','Wait a day','Wait a day','Wait 50 years!','Done!'];
        box.innerHTML='<div class="pic"></div><div class="controls"><button class="btn small toybtn"></button><div class="readout">Waits: <b class="num out">0</b></div></div><p class="cap msg" style="margin-top:12px"></p>';
        const pic=box.querySelector('.pic'), btn=box.querySelector('.toybtn'), msg=box.querySelector('.msg'), out=box.querySelector('.out');
        function draw(){ pic.innerHTML=A.frame(twoPrints(at)); msg.textContent=MSG[at]; btn.textContent=LAB[at]; out.textContent=String(at); }
        btn.onclick=()=>{ if(at>=4) return; at+=1; draw(); if(at>=4){ btn.disabled=true; api.done(); } };
        draw();
      }
    },
    landers: {
      title: 'Your turn: land all 6', cap: 'Tap the button to land a ship. Each ship brings 2 moonwalkers. Count by 2s!', hint: 'Land all 6 ships first.',
      init(box, api){
        let n=0;
        box.innerHTML='<div class="pic"></div><div class="controls"><button class="btn small toybtn">Land a ship</button><div class="readout">Moonwalkers: <b class="num out">0</b></div></div><p class="cap msg" style="margin-top:12px"></p>';
        const pic=box.querySelector('.pic'), btn=box.querySelector('.toybtn'), out=box.querySelector('.out'), msg=box.querySelector('.msg');
        function draw(){
          pic.innerHTML=A.frame(sixLanders(n), true);
          out.textContent=String(n*2);
          msg.textContent = n===0 ? 'The Moon is empty. Land the first ship!' : n<6 ? n+(n===1?' ship':' ships')+', '+(n*2)+' moonwalkers. Keep counting by 2s!' : '6 ships, 12 moonwalkers. That is everybody who has ever walked on the Moon!';
        }
        btn.onclick=()=>{ if(n>=6) return; n+=1; draw(); if(n>=6){ btn.disabled=true; api.done(); } };
        draw();
      }
    }
  };
})();
</script>
