        + '<rect x="350" y="70" width="260" height="192" fill="#C8694A" stroke="'+INK+'" stroke-width="3"/><path d="M350 166h260" stroke="'+INK+'" stroke-width="3"/>'
        + '<rect x="376" y="92" width="76" height="74" fill="#3A2A22" stroke="'+INK+'" stroke-width="3"/>'
        + [0,1].map(i=>'<rect x="'+(486+i*58)+'" y="100" width="36" height="44" fill="#BFE3FA" stroke="'+INK+'" stroke-width="3"/>').join('')
        + [0,1,2].map(i=>'<rect x="'+(376+i*80)+'" y="194" width="44" height="48" fill="#BFE3FA" stroke="'+INK+'" stroke-width="3"/>').join('')
        + A.tag(410, 34, 140, 'bed factory')
        + '<rect x="96" y="196" width="104" height="66" rx="6" fill="#8A8E9B" stroke="'+INK+'" stroke-width="3"/><circle cx="128" cy="228" r="20" fill="#C9CED6" stroke="'+INK+'" stroke-width="3"/><circle cx="128" cy="228" r="6" fill="'+INK+'"/><rect x="160" y="208" width="28" height="40" fill="#C9CED6" stroke="'+INK+'" stroke-width="3"/>'
        + A.tag(74, 156, 148, 'heavy machine')
        + '<path d="M214 196Q280 96 362 124" fill="none" stroke="'+INK+'" stroke-width="4" stroke-dasharray="4 10" stroke-linecap="round"/><path d="M350 112l14 12l-17 8" fill="none" stroke="'+INK+'" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>'
        + A.person(262, 262, '#1D4ED8', false, true)
        + A.tag(150, 20, 150, 'Yonkers, 1852'));
    },
    crowd(){
      return A.frame('<rect width="640" height="300" fill="'+CREAM+'"/>'
        + '<path d="M30 262V150Q320 -70 610 150V262" fill="#E3F3FB" stroke="#3FA7D6" stroke-width="5"/><path d="M130 262V86M510 262V86M30 150H610" stroke="#3FA7D6" stroke-width="3" opacity="0.7"/>'
        + '<rect y="262" width="640" height="38" fill="#B58A5A"/>'
        + lift(320, 30, 262, 120, 122, {teeth:true, spring:'bent', load:'person'})
        + crowdRow(52, 232, 262) + crowdRow(408, 590, 262)
        + A.tag(20, 16, 196, 'New York City, 1854') + A.tag(424, 70, 180, 'The rope gets cut!') + '<path d="M424 84L330 60" stroke="'+INK+'" stroke-width="3" stroke-linecap="round"/>');
    },
    safe(){
      return A.frame('<rect width="640" height="300" fill="'+CREAM+'"/>'
        + '<g transform="translate(0,-10) scale(1.6)">' + lift(200, -30, 220, 120, 150, {teeth:true, spring:'out', cut:true, ropeEnd:44, load:'person'}) + '</g>'
        + A.text(108, 110, 34, 'CLUNK!', RED)
        + A.tag(448, 66, 180, 'The spring pops out.') + '<path d="M448 80L414 122" stroke="'+INK+'" stroke-width="3" stroke-linecap="round"/>'
        + A.tag(448, 176, 150, 'Teeth catch it.') + '<path d="M448 190L424 150" stroke="'+INK+'" stroke-width="3" stroke-linecap="round"/>'
        + A.tag(6, 250, 196, 'It fell a few inches.'));
    },
    store(){
      return A.frame(A.sun(70,50)
        + '<rect y="262" width="640" height="38" fill="#8A8E9B"/>'
        + storeFront(150, 240, 5)
        + '<rect x="390" y="62" width="80" height="200" fill="#4A4C58" stroke="'+INK+'" stroke-width="3"/><rect x="390" y="262" width="80" height="36" fill="#6A4A3A" stroke="'+INK+'" stroke-width="3"/>'
        + '<path d="M430 64V150" stroke="#fff" stroke-width="3"/><rect x="404" y="150" width="52" height="32" rx="4" fill="'+GOLD+'" stroke="'+INK+'" stroke-width="3"/>'
        + '<rect x="404" y="270" width="34" height="22" rx="3" fill="'+RED+'" stroke="'+INK+'" stroke-width="3"/><circle cx="452" cy="281" r="10" fill="#C9CED6" stroke="'+INK+'" stroke-width="3"/>'
        + [1,2,3,4,5].map(n=>A.text(136, 262-(n-1)*40-12, 18, String(n), INK, 'end')).join('')
        + A.tag(486, 152, 130, 'the elevator') + A.tag(486, 266, 140, 'steam engine')
        + A.tag(190, 14, 160, 'Broadway, 1857')
        + A.person(40, 262, '#7B2CBF') + A.person(84, 262, '#F46036', true));
    },
    empire(){
      return A.frame(A.nightSky()
        + A.skyline(20,[60,84,50,70,56],DARK,262) + A.skyline(300,[60,80,50,70,56,76,48,66,54,72,50,64,58,70],DARK,262)
        + tower(210, 262, 250, 100)
        + '<rect y="262" width="640" height="38" fill="'+DARK+'"/>'
        + A.text(440, 104, 84, '73', '#FFD34D') + A.tag(350, 118, 180, 'elevators inside') + A.tag(18, 20, 140, 'opened in 1931'), true);
    },
    tryit(){
      return A.frame(A.sun(580,50)
        + '<rect y="262" width="640" height="38" fill="#8A8E9B"/>'
        + storeFront(340, 230, 5)
        + '<path d="M210 262V70" stroke="'+INK+'" stroke-width="6" stroke-linecap="round"/>' + A.tag(110, 72, 100, 'Broadway') + A.tag(210, 104, 110, 'Broome St')
        + A.person(70, 262, '#F9C80E', true) + A.person(270, 262, '#1D4ED8')
        + A.tag(20, 16, 170, 'It is still there!'));
    }
  };

  /* ===== the three things to play with ===== */
  window.TOYS = {
    brake: {
      title: 'Your turn: cut the rope!', cap: 'Pick a lift. Then cut its rope. Try both lifts!', hint: 'Cut the rope on both lifts first.',
      init(box, api){
        let mode=null, cut=false; const tried={};
        box.innerHTML='<div class="pic"></div><div class="controls"><button class="btn small toybtn" data-m="plain">Plain lift</button><button class="btn small toybtn" data-m="spring">Lift with a spring</button><button class="btn small toybtn" data-m="cut">Cut the rope!</button></div><p class="cap msg" style="margin-top:12px"></p>';
        const pic=box.querySelector('.pic'), msg=box.querySelector('.msg'), bs=box.querySelectorAll('.toybtn');
        function draw(){
          pic.innerHTML=A.frame(brakePic(mode, cut));
          const choosing = !mode || cut;
          bs[0].disabled = !choosing || !!tried.plain; bs[1].disabled = !choosing || !!tried.spring; bs[2].disabled = choosing;
          msg.textContent = !mode ? 'Two lifts full of boxes. Which rope will you cut first?'
            : !cut ? (mode==='plain' ? 'The plain lift hangs on its rope. Nothing else holds it.' : 'The rope pulls the red spring into a bend. See the teeth on the rails?')
            : mode==='plain' ? 'Whoosh! Nothing stops the plain lift. Good thing it only had boxes on it.' : 'The spring popped out flat and the teeth caught it. The lift dropped just a little!';
        }
        bs.forEach(b=>{ b.onclick=()=>{
          const m=b.dataset.m;
          if(m==='cut'){ if(!mode || cut) return; cut=true; tried[mode]=true; }
          else { if(tried[m]) return; mode=m; cut=false; }
          draw();
          if(tried.plain && tried.spring) api.done();
        }; });
        draw();
      }
    },
    ride: {
      title: 'Your turn: the slow ride', cap: 'Tap the button to ride up. Count the feet by 5s!', hint: 'Ride all the way up to 40 feet first.',
      init(box, api){
        let feet=0;
        box.innerHTML='<div class="pic"></div><div class="controls"><button class="btn small toybtn">Up 5 feet</button><div class="readout">Feet: <b class="num out">0</b></div></div><p class="cap msg" style="margin-top:12px"></p>';
        const pic=box.querySelector('.pic'), btn=box.querySelector('.toybtn'), out=box.querySelector('.out'), msg=box.querySelector('.msg');
        function draw(){
          pic.innerHTML=A.frame(ridePic(feet)); out.textContent=String(feet);
          msg.textContent = feet===0 ? 'All aboard! Watch the clock while you ride.' : feet<40 ? feet+' feet. Keep counting by 5s!' : '40 feet! That took one whole minute.';
        }
        btn.onclick=()=>{ if(feet>=40) return; feet+=5; draw(); if(feet>=40){ btn.disabled=true; api.done(); } };
        draw();
      }
    },
    zoom: {
      title: 'Your turn: zoom to the top', cap: 'Tap the button to zoom up. Count the floors by 10s!', hint: 'Zoom all the way up to floor 100 first.',
      init(box, api){
        let floor=0;
        box.innerHTML='<div class="pic"></div><div class="controls"><button class="btn small toybtn">Up 10 floors</button><div class="readout">Floor: <b class="num out">0</b></div></div><p class="cap msg" style="margin-top:12px"></p>';
        const pic=box.querySelector('.pic'), btn=box.querySelector('.toybtn'), out=box.querySelector('.out'), msg=box.querySelector('.msg');
        function draw(){
          pic.innerHTML=A.frame(zoomPic(floor), true); out.textContent=String(floor);
          msg.textContent = floor===0 ? 'You are on the street. Going up!' : floor<100 ? 'Floor '+floor+'. Keep counting by 10s!' : 'Floor 100! You are almost at the very top, and your legs are not even tired.';
        }
        btn.onclick=()=>{ if(floor>=100) return; floor+=10; draw(); if(floor>=100){ btn.disabled=true; api.done(); } };
        draw();
      }
    }
  };
})();
</script>

</body>
