      return A.frame('<rect width="640" height="300" fill="'+CREAM+'"/><rect y="262" width="640" height="38" fill="'+FLOOR+'"/>'
        + guitar(300, 262, 1.25, {cones:true}) + arcs(362, 200, 3, RED)
        + A.tag(20, 150, 170, 'three metal cones') + '<path d="M190 164L266 214" stroke="'+INK+'" stroke-width="3" stroke-linecap="round"/>'
        + A.person(110, 262, '#1D4ED8', true)
        + A.tag(440, 30, 90, 'Louder!') + A.tag(440, 240, 186, 'But not loud enough.'));
    },
    fryingpan(){
      return A.frame('<rect width="640" height="300" fill="'+CREAM+'"/>'
        + pan(150, 120, 1.5)
        + A.tag(60, 16, 110, 'round body') + A.tag(330, 60, 100, 'long neck')
        + A.tag(214, 172, 150, 'magnet and wire') + '<path d="M214 186L176 150" stroke="'+INK+'" stroke-width="3" stroke-linecap="round"/>'
        + '<g stroke="'+INK+'" stroke-width="3"><rect x="130" y="236" width="150" height="14" rx="6" fill="#3A2A22"/><circle cx="96" cy="243" r="40" fill="#4A4C58"/><circle cx="96" cy="243" r="30" fill="#6E7480"/></g>'
        + A.tag(300, 230, 126, 'a frying pan') + A.text(540, 250, 34, 'Twins!', RED));
    },
    wiggle(){
      return A.frame('<rect width="640" height="300" fill="'+CREAM+'"/><rect y="262" width="640" height="38" fill="'+FLOOR+'"/>'
        + stringLine(50, 590, 80, '#6E7480', 5, true, 20)
        + A.tag(20, 14, 170, 'the thickest string')
        + A.text(250, 220, 90, '82', RED) + A.tag(320, 170, 200, 'wiggles every second') + A.tag(320, 206, 150, 'Too fast to see!'));
    },
    stage(){
      return A.frame(A.nightSky()
        + '<rect x="120" y="190" width="400" height="30" fill="#6A4A3A" stroke="'+INK+'" stroke-width="3"/>'
        + A.person(240, 190, '#F9C80E') + '<g transform="translate(206,168) scale(0.3)">' + pan(0, 0, 1) + '</g>'
        + '<rect x="330" y="120" width="70" height="70" rx="8" fill="#3A2A22" stroke="'+INK+'" stroke-width="3"/><circle cx="365" cy="158" r="22" fill="#6E7480" stroke="'+INK+'" stroke-width="3"/>'
        + arcs(410, 150, 5, '#FFD34D', 16)
        + '<rect y="262" width="640" height="38" fill="'+DARK+'"/>'
        + crowdRow(60, 590, 268)
        + A.tag(20, 20, 60, '1932') + A.tag(130, 60, 240, 'Now everybody can hear it!'), true);
    },
    museum(){
      return A.frame(A.sun(70,50)
        + '<rect y="262" width="640" height="38" fill="#8A8E9B"/>'
        + '<path d="M40 104L190 50L340 104Z" fill="#E8E2D0" stroke="'+INK+'" stroke-width="3" stroke-linejoin="round"/><rect x="50" y="104" width="280" height="14" fill="#E8E2D0" stroke="'+INK+'" stroke-width="3"/>'
        + [0,1,2,3,4].map(i=>'<rect x="'+(66+i*58)+'" y="118" width="20" height="118" fill="#fff" stroke="'+INK+'" stroke-width="3"/>').join('')
        + '<rect x="40" y="236" width="300" height="12" fill="#E8E2D0" stroke="'+INK+'" stroke-width="3"/><rect x="26" y="248" width="328" height="14" fill="#E8E2D0" stroke="'+INK+'" stroke-width="3"/>'
        + A.tag(70, 14, 240, 'Metropolitan Museum of Art')
        + '<rect x="400" y="120" width="220" height="100" rx="8" fill="#DDF2FB" stroke="'+INK+'" stroke-width="4"/><rect x="420" y="220" width="180" height="42" fill="#6A4A3A" stroke="'+INK+'" stroke-width="3"/>'
        + '<g transform="translate(446,170) scale(0.6)">' + pan(0, 0, 1) + '</g>'
        + A.tag(424, 80, 172, 'the real Frying Pan')
        + A.person(374, 262, '#D7263D', true));
    }
  };

  /* ===== the three things to play with ===== */
  window.TOYS = {
    strings: {
      title: 'Your turn: pluck three strings!', cap: 'Pick a string. Then pluck it. Try all three!', hint: 'Pluck all three strings first.',
      init(box, api){
        let kind=null, plucked=false; const tried={};
        box.innerHTML='<div class="pic"></div><div class="controls"><button class="btn small toybtn" data-m="rubber">Rubber band</button><button class="btn small toybtn" data-m="nylon">Nylon string</button><button class="btn small toybtn" data-m="steel">Steel string</button><button class="btn small toybtn" data-m="pluck">Pluck it!</button></div><p class="cap msg" style="margin-top:12px"></p>';
        const pic=box.querySelector('.pic'), msg=box.querySelector('.msg'), bs=box.querySelectorAll('.toybtn');
        function draw(){
          pic.innerHTML=A.frame(stringsPic(kind, plucked));
          const choosing = !kind || plucked;
          bs.forEach(b=>{ const m=b.dataset.m; b.disabled = m==='pluck' ? choosing : (!choosing || !!tried[m]); });
          msg.textContent = !kind ? 'Three strings to test. Which one will make electricity?'
            : !plucked ? 'The '+KINDS[kind][0]+' is over the magnet. Pluck it and watch the screen!'
            : kind==='rubber' ? 'The rubber band wiggles, but the screen stays flat. A magnet does not pull on rubber.'
            : kind==='nylon' ? 'The nylon string wiggles, but the screen stays flat. A magnet does not pull on nylon.'
            : 'The steel string wiggles and the screen jumps! A magnet pulls on steel, so the wiggle makes electricity.';
        }
        bs.forEach(b=>{ b.onclick=()=>{
          const m=b.dataset.m;
          if(m==='pluck'){ if(!kind || plucked) return; plucked=true; tried[kind]=true; }
          else { if(tried[m] || (kind && !plucked)) return; kind=m; plucked=false; }
          draw();
          if(tried.rubber && tried.nylon && tried.steel) api.done();
        }; });
        draw();
      }
    },
    path: {
      title: 'Your turn: send a note!', cap: 'Tap the button to follow one note, step by step.', hint: 'Follow the note all the way to the speaker first.',
      init(box, api){
        let step=0;
        const LINES = ['The guitar is quiet. Tap to pluck the string!', 'Step 1: The steel string wiggles.', 'Step 2: The magnet and wire turn the wiggle into a tiny bit of electricity.', 'Step 3: The electricity runs down the cable.', 'Step 4: The amplifier makes it bigger. Much bigger!', 'Step 5: The speaker pushes the air. Now everybody can hear the guitar!'];
        box.innerHTML='<div class="pic"></div><div class="controls"><button class="btn small toybtn">Pluck the string</button></div><p class="cap msg" style="margin-top:12px"></p>';
        const pic=box.querySelector('.pic'), btn=box.querySelector('.toybtn'), msg=box.querySelector('.msg');
        function draw(){ pic.innerHTML=A.frame(pathPic(step)); msg.textContent=LINES[step]; if(step>0) btn.textContent = step<5 ? 'Next step' : 'LOUD!'; }
        btn.onclick=()=>{ if(step>=5) return; step++; draw(); if(step>=5){ btn.disabled=true; api.done(); } };
        draw();
      }
    },
    count: {
      title: 'Your turn: count the wiggles', cap: 'Tap the button and count the wiggles by 10s!', hint: 'Count all the way up to 110 first.',
      init(box, api){
        let n=0;
        box.innerHTML='<div class="pic"></div><div class="controls"><button class="btn small toybtn">10 more wiggles</button><div class="readout">Wiggles: <b class="num out">0</b></div></div><p class="cap msg" style="margin-top:12px"></p>';
        const pic=box.querySelector('.pic'), btn=box.querySelector('.toybtn'), out=box.querySelector('.out'), msg=box.querySelector('.msg');
        function draw(){
          pic.innerHTML=A.frame(countPic(n)); out.textContent=String(n);
          msg.textContent = n===0 ? 'Pluck! Watch the clock while you count.' : n<110 ? n+' wiggles. Keep counting by 10s!' : '110 wiggles! And that was just ONE second.';
        }
        btn.onclick=()=>{ if(n>=110) return; n+=10; draw(); if(n>=110){ btn.disabled=true; api.done(); } };
        draw();
      }
    }
  };
})();
</script>
