        + animal('elephant', 150, 70, 0.9, {shine:true}) + line(140, 100, 132, 150) + line(160, 100, 168, 150)
        + animal('fish', 330, 110, 0.8, {shine:true}) + line(326, 132, 320, 176)
        + animal('bird', 500, 236, 1.1, {shine:true})
        + [[-70,-8],[-52,-24],[60,-22],[84,-6]].map(p=>'<ellipse cx="'+(500+p[0])+'" cy="'+(236+p[1])+'" rx="5" ry="8" fill="#DDF2FB" stroke="'+INK+'" stroke-width="2"/>').join('')
        + crowd(60, 300, 290, 48, true)
        + A.tag(20, 14, 150, '1928: Let go!') + A.tag(440, 150, 120, 'East River') + A.text(520, 120, 30, 'Splash!', RED));
    },
    sizes(){
      let s = '<rect y="250" width="640" height="50" fill="'+GRASS+'"/>';
      s += animal('tiger', 232, 130, 2.6, {shine:true});
      s += line(36, 214, 444, 214, 4, RED) + line(36, 204, 36, 224, 4, RED) + line(444, 204, 444, 224, 4, RED) + A.tag(190, 222, 100, '60 feet long');
      s += animal('elephant', 530, 140, 0.95, {shine:true});
      s += line(476, 214, 612, 214, 4, RED) + line(476, 204, 476, 224, 4, RED) + line(612, 204, 612, 224, 4, RED) + A.tag(494, 222, 100, '20 feet long');
      return A.frame(s + A.person(460, 290, '#1D4ED8') + A.tag(20, 262, 130, 'tiger balloon') + A.tag(470, 60, 150, 'elephant balloon'));
    },
    plane(){
      return A.frame(A.sun(70, 50) + A.skyline(200, [50,80,60,96,70,88,56,76,64,90], CITY, 300)
        + '<g stroke="'+INK+'" stroke-width="3" stroke-linejoin="round"><path d="M70 150h120q24 0 24 -12q0 -12 -24 -12h-90l-22 -22h-14z" fill="#fff"/><path d="M120 138l-30 34h26l40 -34z" fill="'+RED+'"/><circle cx="218" cy="138" r="5" fill="'+INK+'"/></g>'
        + line(222, 120, 222, 156, 5)
        + animal('fish', 470, 110, 1.15, {shine:true}) + line(460, 142, 452, 200) + line(486, 142, 494, 200)
        + A.text(330, 120, 44, '?', RED)
        + A.tag(20, 200, 250, 'Balloons got in the way.') + A.tag(360, 240, 260, '1932: no more letting go!'));
    },
    helpers(){
      let s = street();
      for(let i=0;i<50;i++) s += A.person(26+i*12, 262, SHIRTS[Math.floor(i/5)%SHIRTS.length]);
      for(let i=0;i<50;i++) s += A.person(26+i*12, 292, SHIRTS[(Math.floor(i/5)+3)%SHIRTS.length]);
      [-50,-20,10,40].forEach(d=>{ s += line(250+d, 118, 250+d*4, 228, 2); });
      s += animal('elephant', 250, 70, 1.45, {shine:true});
      return A.frame(s + A.text(520, 110, 72, '100', RED) + A.tag(424, 126, 196, 'helpers for ONE balloon'));
    },
    today(){
      let s = A.sun(70, 50) + A.skyline(10, [120,160,100,180,130], CITY, 262) + A.skyline(500, [150,110,170,130,100,140], CITY, 262) + street();
      s += crowd(180, 420, 262, 24);
      [-40,-10,20,50].forEach(d=>{ s += line(300+d, 132, 300+d*2.6, 228, 2); });
      s += animal('tiger', 300, 90, 1.7, {shine:true});
      return A.frame(s + A.tag(440, 14, 190, 'Thanksgiving morning') + A.tag(214, 196, 172, 'Spot the helpers!') );
    }
  };

  /* ===== the three things to play with ===== */
  window.TOYS = {
    gas: {
      title: 'Your turn: fill a balloon three ways!', cap: 'Pick what goes inside. Then let go. Try all three!', hint: 'Try air, helium and water first.',
      init(box, api){
        let kind=null, gone=false; const tried={};
        box.innerHTML='<div class="pic"></div><div class="controls"><button class="btn small toybtn" data-m="air">Air</button><button class="btn small toybtn" data-m="helium">Helium</button><button class="btn small toybtn" data-m="water">Water</button><button class="btn small toybtn" data-m="go">Let go!</button></div><p class="cap msg" style="margin-top:12px"></p>';
        const pic=box.querySelector('.pic'), msg=box.querySelector('.msg'), bs=box.querySelectorAll('.toybtn');
        function draw(){
          pic.innerHTML=A.frame(gasPic(kind, gone));
          const choosing = !kind || gone;
          bs.forEach(b=>{ const m=b.dataset.m; b.disabled = m==='go' ? choosing : (!choosing || !!tried[m]); });
          msg.textContent = !kind ? 'Three balloons to test. Which one will float up?'
            : !gone ? 'The balloon is full of '+kind+'. Let go and watch!'
            : kind==='air' ? 'The air balloon sinks slowly to the floor. With its rubber skin, it is a tiny bit heavier than the air around it.'
            : kind==='water' ? 'SPLASH! Water is much heavier than air, so the water balloon drops fast.'
            : 'The helium balloon floats up to the ceiling! Helium is lighter than air.';
        }
        bs.forEach(b=>{ b.onclick=()=>{
          const m=b.dataset.m;
          if(m==='go'){ if(!kind || gone) return; gone=true; tried[kind]=true; }
          else { if(tried[m] || (kind && !gone)) return; kind=m; gone=false; }
          draw();
          if(tried.air && tried.helium && tried.water) api.done();
        }; });
        draw();
      }
    },
    valve: {
      title: 'Your turn: bring the balloon down softly!', cap: 'Tap the button to let a little helium out, puff by puff.', hint: 'Bring the balloon all the way down first.',
      init(box, api){
        let step=0;
        const LINES = ['The fish balloon is high over the houses. Open the valve a little!', 'Psss! A little helium leaks out. The balloon sinks a bit.', 'Psss! Less helium, less lift. Down it comes.', 'Psss! Almost there. Nice and slow.', 'A soft landing in a yard! The tag tells the finder where to send it.'];
        box.innerHTML='<div class="pic"></div><div class="controls"><button class="btn small toybtn">Let a little helium out</button></div><p class="cap msg" style="margin-top:12px"></p>';
        const pic=box.querySelector('.pic'), btn=box.querySelector('.toybtn'), msg=box.querySelector('.msg');
        function draw(){ pic.innerHTML=A.frame(valvePic(step)); msg.textContent=LINES[step]; if(step>=4) btn.textContent='Landed!'; }
        btn.onclick=()=>{ if(step>=4) return; step++; draw(); if(step>=4){ btn.disabled=true; api.done(); } };
        draw();
      }
    },
    count: {
      title: 'Your turn: count the helpers', cap: 'Tap the button and count the helpers by 10s!', hint: 'Count all the way up to 100 first.',
      init(box, api){
        let n=0;
        box.innerHTML='<div class="pic"></div><div class="controls"><button class="btn small toybtn">10 more helpers</button><div class="readout">Helpers: <b class="num out">0</b></div></div><p class="cap msg" style="margin-top:12px"></p>';
        const pic=box.querySelector('.pic'), btn=box.querySelector('.toybtn'), out=box.querySelector('.out'), msg=box.querySelector('.msg');
        function draw(){
          pic.innerHTML=A.frame(countPic(n)); out.textContent=String(n);
          msg.textContent = n===0 ? 'Nobody is holding the ropes. The balloon is pulling up!' : n<100 ? n+' helpers. It still pulls up. Keep counting by 10s!' : '100 helpers! Now the giant balloon is steady.';
        }
        btn.onclick=()=>{ if(n>=100) return; n+=10; draw(); if(n>=100){ btn.disabled=true; api.done(); } };
        draw();
      }
    }
  };
})();
</script>
