<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lenny's Daily Kickoff · All games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="../assets/engine.css">
</head>
<body>
<div id="app">
  <header class="topbar"><div class="topbar-in"><a class="brand" href="../" id="brand"></a><div style="flex:1"></div></div></header>
  <main><section class="step hero shown"><h1>All games</h1><p class="lede">Missed a day? Play it here. Replays still score goals.</p><div class="weeklist" id="list">Loading...</div>
  <div class="next"><a class="btn ghost small" id="home" href="../">Back to today</a></div></section></main>
</div>
<script src="../assets/common.js"></script>
<script>
(function(){
  const L=window.LDK, esc=L.esc, TODAY=L.today(), p=L.currentPlayer(), QS = L.LOCAL && location.search ? location.search : '';
  document.getElementById('brand').innerHTML=L.ICON.ball+'<span class="t">Lenny\'s Daily Kickoff</span>';
  document.getElementById('home').href='../'+QS;
  fetch('../editions.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{
    const list=(data.editions||[]).filter(e=>e.date<=TODAY).sort((a,b)=>b.n-a.n);
    document.getElementById('list').innerHTML=list.map(e=>{ const d=!!(p&&p.history&&p.history[e.code]&&p.history[e.code].complete);
      return '<a class="weekrow'+(d?' done':'')+'" href="../'+esc(e.path)+QS+'"><span class="st">'+(d?'&#10003;':e.n)+'</span><span>'+esc(e.title)+'<small>'+esc(L.prettyDate(e.date))+'</small></span><span class="go">'+(d?'Done':e.date<TODAY?'Replay':'Play')+'</span></a>'; }).join('')||'No games yet.';
  }).catch(()=>{ document.getElementById('list').textContent='Could not load the list. Try again.'; });
})();
</script>
</body>
</html>
