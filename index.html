<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lenny's Daily Kickoff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="assets/engine.css">
</head>
<body>
<div id="app">
  <header class="topbar"><div class="topbar-in"><a class="brand" href="./" id="brand"></a><div style="flex:1"></div><div class="who" id="who"></div></div></header>
  <main id="hub"><section class="step hero shown"><h1>Lenny's Daily Kickoff</h1><p class="lede" id="loading">Getting today's game...</p></section></main>
</div>
<script src="assets/common.js"></script>
<script>
/* Home page: picks today's game by date, shows this week, replays and the weekend passcode. */
(function(){
  'use strict';
  const L=window.LDK, esc=L.esc, DB=L.db(), TODAY=L.today(), WEEK=L.isoWeek(TODAY), DOW=L.dayOfWeek(TODAY), WEEKEND=(DOW===0||DOW===6);
  const QS = L.LOCAL && location.search ? location.search : '';     // keeps ?today= on a test machine
  document.getElementById('brand').innerHTML=L.ICON.ball+'<span class="t">Lenny\'s Daily Kickoff</span>';
  function done(p, ed){ return !!(p && p.history && p.history[ed.code] && p.history[ed.code].complete); }
  function render(data){
    const eds=(data.editions||[]).filter(e=>e.date<=TODAY).sort((a,b)=>a.n-b.n);
    const todayEd=eds.find(e=>e.date===TODAY), weekEds=eds.filter(e=>L.isoWeek(e.date)===WEEK);
    const p=L.currentPlayer();
    let h='<section class="step hero shown"><div class="eyebrow"><span class="tag">'+esc(L.prettyDate(TODAY))+'</span></div><h1>Lenny\'s Daily Kickoff</h1>';

    /* player */
    if(p){
      const lg=L.leagueFor(p.goals);
      h+='<div class="hubcard"><div class="playerstrip"><span>'+L.shirt(p.kit,64)+'</span><div class="meta">'+esc(p.name)+'<small>'+lg.name+' · '+p.goals+' goals · streak '+p.streak+'</small></div></div>';
      if(DB.order.length>1) h+='<div class="switch">'+DB.order.filter(id=>DB.players[id]!==p).map(id=>'<button class="btn ghost small" data-switch="'+id+'">Play as '+esc(DB.players[id].name)+'</button>').join('')+'</div>';
      h+='</div>';
    }

    /* today */
    h+='<div class="hubcard today">';
    if(todayEd){
      const d=done(p,todayEd);
      h+='<h2>'+(d?'You finished today\'s game!':'Today\'s game is ready')+'</h2><p class="lede" style="margin-top:6px">Game '+todayEd.n+': '+esc(todayEd.title)+'</p><div class="next" style="margin-bottom:0"><a class="btn" id="playToday" href="'+esc(todayEd.path)+QS+'">'+(d?'See my result':(p?'Play, '+esc(p.name)+'!':'Play today\'s game'))+'</a></div>';
    } else if(WEEKEND){
      h+='<h2>It is the weekend!</h2><p class="lede" style="margin-top:6px">No new game today. A new one comes on the next school day.</p>';
    } else {
      h+='<h2>No new game right now</h2><p class="lede" style="margin-top:6px">Check back after school. On a day off, there is no new game.</p>';
    }
    h+='</div>';

    /* weekend passcode */
    if(WEEKEND && weekEds.length && data.weeks && data.weeks[WEEK]){
      const missing=weekEds.filter(e=>!done(p,e));
      if(!missing.length){
        h+='<div class="vault open" id="weekendVault"><div class="lock">'+L.ICON.lockOpen+'</div><h3>You played every game this week. The weekend passcode is:</h3><div class="pw">'+esc(L.decode(data.weeks[WEEK]))+'</div><p class="small" style="margin:0">Tell it to a grown-up at home.</p></div>';
      } else {
        h+='<div class="vault" id="weekendVault"><div class="lock">'+L.ICON.lockShut+'</div><h3>The weekend passcode is still locked</h3><p style="margin:6px 0 0;font-weight:700">Finish the '+(missing.length===1?'game':missing.length+' games')+' you missed this week to open it.</p></div>';
      }
    }

    /* this week */
    if(weekEds.length){
      h+='<div class="hubcard"><h2>This week</h2><div class="weeklist">'+weekEds.map(e=>{ const d=done(p,e), replay=e.date<TODAY;
        return '<a class="weekrow'+(d?' done':'')+'" href="'+esc(e.path)+QS+'"><span class="st">'+(d?'&#10003;':e.n)+'</span><span>'+esc(e.title)+'<small>'+esc(L.dayName(e.date))+'</small></span><span class="go">'+(d?'Done':replay?'Replay':'Play')+'</span></a>'; }).join('')+'</div></div>';
    }
    h+='<div class="next"><a class="btn ghost small" href="e/'+QS+'">All games</a></div></section>';
    document.getElementById('hub').innerHTML=h;
    document.getElementById('who').innerHTML = p ? '<span class="statpill" title="Total goals">'+L.ICON.ball+'<span class="num">'+p.goals+'</span></span>' : '';
    document.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>{ DB.last=b.dataset.switch; L.save(); render(data); });
  }
  fetch('editions.json',{cache:'no-store'}).then(r=>r.json()).then(render).catch(()=>{ document.getElementById('loading').textContent='Could not load the games. Check the internet and try again.'; });
})();
</script>
</body>
</html>
